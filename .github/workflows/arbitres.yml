name: Arbitres et penalties

on:
  schedule:
    - cron: '17 5 * * *'
    - cron: '23 13 * * *'
    - cron: '41 16 * * 2,3,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Coupes d'Europe (UEFA)
        run: node outils/arbitres.mjs
        continue-on-error: true
      - name: 5 grands championnats (API-Football)
        run: node outils/ligues.mjs
        continue-on-error: true
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
      - name: Enregistrer les fichiers
        run: |
          git config user.name "pronostats-bot"
          git config user.email "pronostats-bot@users.noreply.github.com"
          for f in arbitres.json ligues.json ligues-cache.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || (git commit -m "Mise à jour des stats d'arbitres" && git push)
