<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1020">
<meta name="description" content="PronoStats – stats, résultats et suivi de tes paris foot">
<title>PronoStats</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A1020; --surface:#111A2E; --surface2:#18233C; --line:#243150;
  --gold:#D4AF37; --gold2:#F0D27A; --gold-dim:rgba(212,175,55,.14);
  --text:#EFE8D6; --muted:#8C94AB; --win:#3FBF7F; --loss:#E2625E; --draw:#6E7791;
  --r:16px; --nav:68px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font:15px/1.4 Barlow,system-ui,sans-serif;min-height:100%}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.cond{font-family:"Barlow Condensed",Barlow,sans-serif}

/* ---------- Header ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 10px;
  background:linear-gradient(var(--bg) 70%,rgba(10,16,32,.85));backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;flex:1}
.brand img{width:34px;height:34px;border-radius:10px}
.brand span{font:700 24px/1 "Barlow Condensed",sans-serif;letter-spacing:.5px;text-transform:uppercase}
.brand b{color:var(--gold)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.maj{padding:0 16px 6px;color:var(--muted);font-size:12px}

/* ---------- Layout ---------- */
main{padding:4px 16px 96px;max-width:640px;margin:0 auto}
h2{font:600 13px/1 "Barlow Condensed",sans-serif;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);margin:22px 2px 10px}
h2:first-child{margin-top:8px}
.empty{color:var(--muted);text-align:center;padding:48px 16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-weight:500;font-size:14px;white-space:nowrap}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1A1405;font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}

/* ---------- Match card ---------- */
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;letter-spacing:.3px;margin-bottom:10px}
.meta .comp{text-transform:uppercase;font-weight:600}
.meta .heure{font:600 15px "Barlow Condensed",sans-serif;color:var(--gold2)}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.team{display:flex;flex-direction:column;gap:6px;min-width:0}
.team.r{align-items:flex-end;text-align:right}
.team .nm{font:700 20px/1.1 "Barlow Condensed",sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.team .pos{font-size:12px;color:var(--muted)}
.vs{font:600 13px "Barlow Condensed",sans-serif;color:var(--gold);border:1px solid var(--gold-dim);background:var(--gold-dim);border-radius:8px;padding:3px 7px}
.form{display:flex;gap:3px}
.p{display:grid;place-items:center;width:19px;height:19px;border-radius:5px;font:700 11px "Barlow Condensed",sans-serif;font-style:normal;color:#0A1020}
.p.V{background:var(--win)}.p.N{background:var(--draw)}.p.D{background:var(--loss)}
.stats{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:9px}
.st{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;font-size:13px}
.st .v{font:600 15px "Barlow Condensed",sans-serif}
.st .v.r{text-align:right}
.st .v.best{color:var(--gold2)}
.st .mid{display:flex;flex-direction:column;gap:4px}
.st .lbl{text-align:center;color:var(--muted);font-size:11.5px;letter-spacing:.2px}
.bars{display:flex;gap:3px;height:5px}
.bars i{display:block;height:100%;border-radius:3px}
.bars .a{background:var(--gold);margin-left:auto}
.bars .b{background:#5B6A91}
.bars>div{flex:1;display:flex;background:var(--surface2);border-radius:3px;overflow:hidden}
.bars>div:last-child i{margin-left:0}
.betbtn{margin-top:12px;width:100%;padding:10px;border-radius:12px;border:1px dashed rgba(212,175,55,.45);color:var(--gold);font-weight:600;font-size:14px}

/* ---------- Résultats ---------- */
.res{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:12px 14px}
.res+.res{border-top:1px solid var(--line)}
.res .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .t.r{text-align:right}
.res .t.w{color:var(--text)} .res .t.l{color:var(--muted);font-weight:500}
.score{font:700 20px "Barlow Condensed",sans-serif;background:var(--surface2);border-radius:9px;padding:2px 10px;min-width:62px;text-align:center}
.score small{display:block;font:500 10.5px Barlow;color:var(--muted);margin-top:-2px}
.live .score{color:var(--gold2);box-shadow:0 0 0 1px var(--gold) inset}
.badge{font:700 10px Barlow;letter-spacing:.8px;color:#1A1405;background:var(--gold);border-radius:4px;padding:1px 5px;vertical-align:2px;margin-left:6px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.45}}
.group{padding:0;overflow:hidden}
.ghead{padding:8px 14px;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);background:var(--surface2);font-weight:600}

/* ---------- Classement ---------- */
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 11.5px Barlow;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;text-align:center;padding:8px 4px;border-bottom:1px solid var(--line)}
td{text-align:center;padding:9px 4px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.eq,th.eq{text-align:left;font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.pos{font:700 15px "Barlow Condensed",sans-serif;color:var(--muted);width:30px}
tr.top4 td.pos{color:var(--gold)}
td.pts{font:700 16px "Barlow Condensed",sans-serif;color:var(--gold2)}
td .form{justify-content:center}
td .p{width:15px;height:15px;font-size:9px;border-radius:4px}
.tablecard{padding:4px 6px}

/* ---------- Mes paris ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi.hero{grid-column:1/-1;background:linear-gradient(135deg,#1C2540,#121A2E 60%);border-color:rgba(212,175,55,.35)}
.kpi .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.kpi .n{font:700 26px/1.15 "Barlow Condensed",sans-serif}
.kpi.hero .n{font-size:40px}
.pos-v{color:var(--win)} .neg-v{color:var(--loss)}
.typerow{display:grid;grid-template-columns:1fr auto auto;gap:14px;padding:10px 14px;font-size:14px;align-items:center}
.typerow+.typerow{border-top:1px solid var(--line)}
.typerow .s{color:var(--muted);font-size:12.5px}
.typerow .b{font:600 16px "Barlow Condensed",sans-serif;min-width:64px;text-align:right}
.pari{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;cursor:pointer}
.pari .m{font-weight:600}
.pari .d{color:var(--muted);font-size:13px}
.pari .g{font:700 18px "Barlow Condensed",sans-serif;text-align:right}
.tag{justify-self:end;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.tag.Gagné{background:rgba(63,191,127,.15);color:var(--win)}
.tag.Perdu{background:rgba(226,98,94,.15);color:var(--loss)}
.tag.cours{background:var(--gold-dim);color:var(--gold2)}
.fab{position:fixed;right:18px;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));z-index:15;width:58px;height:58px;border-radius:18px;
  background:linear-gradient(145deg,var(--gold2),var(--gold));color:#1A1405;font-size:30px;font-weight:500;box-shadow:0 10px 24px rgba(0,0,0,.45)}

/* ---------- Nav ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);
  height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:rgba(13,20,38,.96);border-top:1px solid var(--line);backdrop-filter:blur(10px)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.3px}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--gold)}
.tabs button.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.tabs button{position:relative}

/* ---------- Bottom sheet ---------- */
.veil{position:fixed;inset:0;z-index:40;background:rgba(3,6,14,.6);display:flex;align-items:flex-end;justify-content:center}
.veil.hidden{display:none}
.sheet{width:100%;max-width:640px;background:var(--surface);border-radius:22px 22px 0 0;border-top:1px solid rgba(212,175,55,.35);
  padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{font:700 22px "Barlow Condensed",sans-serif;margin-bottom:14px}
label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 6px;letter-spacing:.3px}
input,select{width:100%;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);outline:none;font-size:16px}
input:focus,select:focus{border-color:var(--gold)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{padding:10px 4px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{border-color:var(--gold);color:var(--gold2);background:var(--gold-dim)}
.gain{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--bg);display:flex;justify-content:space-between;color:var(--muted)}
.gain b{color:var(--gold2);font:700 18px "Barlow Condensed",sans-serif}
.primary{width:100%;margin-top:18px;padding:14px;border-radius:14px;background:linear-gradient(145deg,var(--gold2),var(--gold));color:#1A1405;font-weight:700;font-size:16px}
.primary:disabled{opacity:.6}
.danger{width:100%;margin-top:10px;padding:12px;border-radius:14px;color:var(--loss);border:1px solid rgba(226,98,94,.35);font-weight:600}

/* ---------- Config ---------- */
.config{padding-top:30px;text-align:center}
.config img{width:96px;height:96px;border-radius:26px;box-shadow:0 14px 40px rgba(212,175,55,.18)}
.config h1{font:700 34px "Barlow Condensed",sans-serif;text-transform:uppercase;margin-top:16px}
.config h1 b{color:var(--gold)}
.config p{color:var(--muted);margin:6px 0 24px}
.config form{text-align:left}
.err{color:var(--loss);font-size:13.5px;margin-top:12px;text-align:center}

#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;
  background:var(--surface2);border:1px solid var(--gold);color:var(--text);padding:10px 16px;border-radius:12px;font-size:14px;
  max-width:90vw;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><img src="icon-192.png" alt=""><span>Prono<b>Stats</b></span></div>
  <button class="iconbtn" id="btnRefresh" aria-label="Actualiser">
    <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  </button>
  <button class="iconbtn" id="btnConfig" aria-label="Réglages">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>
<div class="maj" id="maj"></div>

<main id="view"></main>

<button class="fab" id="fab" hidden aria-label="Ajouter un pari">+</button>

<nav class="tabs" id="tabs">
  <button data-tab="matchs" class="on">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z"/><path d="M12 3v4M16 10l4.5-1.5M14.5 14.5l2.5 4M9.5 14.5L7 18.5M8 10L3.5 8.5"/></svg>
    <span>Matchs</span></button>
  <button data-tab="resultats">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 10h3M8 14h3M14.5 9.5v5M17 9.5v5"/></svg>
    <span>Résultats</span></button>
  <button data-tab="classements">
    <svg viewBox="0 0 24 24"><path d="M4 20V11h4v9M10 20V5h4v15M16 20v-6h4v6"/></svg>
    <span>Classements</span></button>
  <button data-tab="paris">
    <svg viewBox="0 0 24 24"><path d="M5 4h14v16l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 9h6M9 13h4"/></svg>
    <span>Mes paris</span></button>
</nav>

<div class="veil hidden" id="veil"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
const TYPES = ['1N2','Double chance','Plus/Moins buts','Les deux marquent','Buteur','Handicap','Combiné','Autre'];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
};
const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbyX2gfkc3UTsq_OFWriAMoC13vqWWNY6Pt_B3JureQ20V0TjjHAFsrYt_uxJOnk8HU/exec';
if(!store.get('ps_url')) store.set('ps_url', DEFAULT_URL);
let D = null, tab = 'matchs', fComp = 'Tous', cComp = null, cRes = 'Tous', chargement = false;

/* ---------- Données ---------- */
async function charger(silencieux){
  const url = store.get('ps_url'), code = store.get('ps_code');
  if(!url || !code){ ecranConfig(); return; }
  if(!D){ const c = store.get('ps_cache'); if(c){ try { D = JSON.parse(c); rendre(); } catch(e){} } }
  chargement = true; $('#btnRefresh').classList.add('spin');
  try{
    const r = await fetch(url + (url.includes('?') ? '&' : '?') + 'code=' + encodeURIComponent(code), {cache:'no-store'});
    const j = await r.json();
    if(j.error) throw new Error(j.error);
    D = j; store.set('ps_cache', JSON.stringify(j));
    rendre();
    if(!silencieux) toast('Données à jour');
  }catch(e){
    if(D){ toast('Hors ligne : affichage des dernières données'); rendre(); }
    else ecranConfig('Connexion impossible : ' + e.message);
  }finally{
    chargement = false; $('#btnRefresh').classList.remove('spin');
  }
}

async function envoyer(payload){
  const r = await fetch(store.get('ps_url'), {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({code: store.get('ps_code')}, payload)),
  });
  const j = await r.json();
  if(j.error) throw new Error(j.error);
  return j;
}

/* ---------- Helpers ---------- */
const jour = iso => { const d = new Date(iso); d.setHours(0,0,0,0); return d; };
function libJour(iso){
  const d = jour(iso), auj = jour(new Date().toISOString());
  const diff = Math.round((d - auj) / 864e5);
  if(diff === 0) return "Aujourd'hui";
  if(diff === 1) return 'Demain';
  if(diff === -1) return 'Hier';
  return d.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
}
const heure = iso => new Date(iso).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
const forme = f => `<div class="form">${String(f || '').split('').map(c => `<i class="p ${c}">${c}</i>`).join('')}</div>`;
const euros = n => (n > 0 ? '+' : '') + n.toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
const fmt = (v, suf) => v == null ? '–' : (suf ? v + suf : String(v).replace('.', ','));
function grouper(liste, cle){
  const m = new Map();
  liste.forEach(x => { const k = cle(x); if(!m.has(k)) m.set(k, []); m.get(k).push(x); });
  return m;
}
function chips(valeurs, actif, attr){
  return `<div class="chips">${['Tous', ...valeurs].map(v =>
    `<button class="chip ${v === actif ? 'on' : ''}" data-${attr}="${esc(v)}">${esc(v)}</button>`).join('')}</div>`;
}
function stat(lbl, a, b, suf, plusPetitMieux){
  const va = a == null ? 0 : a, vb = b == null ? 0 : b, max = Math.max(va, vb, suf ? 100 : 0.01);
  const ba = a != null && b != null && (plusPetitMieux ? va < vb : va > vb);
  const bb = a != null && b != null && (plusPetitMieux ? vb < va : vb > va);
  return `<div class="st">
    <span class="v ${ba ? 'best' : ''}">${fmt(a, suf)}</span>
    <div class="mid"><span class="lbl">${lbl}</span>
      <div class="bars"><div><i class="a" style="width:${va / max * 100}%"></i></div><div><i class="b" style="width:${vb / max * 100}%"></i></div></div></div>
    <span class="v r ${bb ? 'best' : ''}">${fmt(b, suf)}</span></div>`;
}

/* ---------- Vues ---------- */
function vueMatchs(){
  const L = D.prochains || [];
  const comps = [...new Set(L.map(m => m.comp))];
  if(!comps.includes(fComp)) fComp = 'Tous';
  const F = L.filter(m => fComp === 'Tous' || m.comp === fComp);
  let h = chips(comps, fComp, 'comp');
  if(!F.length) return h + `<div class="empty">Aucun match prévu sur les 7 prochains jours.</div>`;
  grouper(F, m => libJour(m.date)).forEach((ms, j) => {
    h += `<h2>${esc(j)}</h2>`;
    ms.forEach(m => {
      h += `<article class="card">
        <div class="meta"><span class="comp">${esc(m.comp)}</span><span class="heure">${heure(m.date)}</span></div>
        <div class="teams">
          <div class="team"><span class="nm">${esc(m.dom)}</span><span class="pos">${m.posDom ? m.posDom + 'e' : ''}</span>${forme(m.formeDom)}</div>
          <span class="vs">VS</span>
          <div class="team r"><span class="nm">${esc(m.ext)}</span><span class="pos">${m.posExt ? m.posExt + 'e' : ''}</span>${forme(m.formeExt)}</div>
        </div>
        <div class="stats">
          ${stat('Buts marqués (dom. / ext.)', m.domPour, m.extPour)}
          ${stat('Buts encaissés (dom. / ext.)', m.domContre, m.extContre, '', true)}
          ${stat('Matchs à +2,5 buts', m.over25Dom, m.over25Ext, '%')}
          ${stat('Les deux équipes marquent', m.bttsDom, m.bttsExt, '%')}
        </div>
        <button class="betbtn" data-bet="${esc(m.dom + ' - ' + m.ext)}">+ Parier sur ce match</button>
      </article>`;
    });
  });
  return h;
}

function vueResultats(){
  const L = D.resultats || [];
  const comps = [...new Set(L.map(m => m.comp))];
  if(!comps.includes(cRes)) cRes = 'Tous';
  const F = L.filter(m => cRes === 'Tous' || m.comp === cRes);
  let h = chips(comps, cRes, 'res');
  if(!F.length) return h + `<div class="empty">Aucun résultat récent.</div>`;
  grouper(F, m => libJour(m.date)).forEach((ms, j) => {
    h += `<h2>${esc(j)}</h2><div class="card group">`;
    grouper(ms, m => m.comp).forEach((mm, c) => {
      h += `<div class="ghead">${esc(c)}</div>`;
      mm.forEach(m => {
        const [a, b] = String(m.score).split('-').map(x => parseInt(x, 10));
        const live = m.statut === 'EN COURS';
        const cd = a > b ? 'w' : a < b ? 'l' : '', ce = b > a ? 'w' : b < a ? 'l' : '';
        h += `<div class="res ${live ? 'live' : ''}">
          <span class="t ${cd}">${esc(m.dom)}</span>
          <span class="score">${esc(m.score)}<small>${live ? 'LIVE' : (m.mt ? 'MT ' + esc(m.mt) : '')}</small></span>
          <span class="t r ${ce}">${esc(m.ext)}</span></div>`;
      });
    });
    h += `</div>`;
  });
  return h;
}

function vueClassements(){
  const L = D.classements || [];
  const comps = [...new Set(L.map(l => l.comp))];
  if(!comps.length) return `<div class="empty">Classements indisponibles.</div>`;
  if(!comps.includes(cComp)) cComp = comps[0];
  let h = `<div class="chips">${comps.map(c => `<button class="chip ${c === cComp ? 'on' : ''}" data-class="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
  h += `<div class="card tablecard"><table><thead><tr><th>#</th><th class="eq">Équipe</th><th>J</th><th>Diff</th><th>Pts</th><th>Forme</th></tr></thead><tbody>`;
  L.filter(l => l.comp === cComp).forEach(l => {
    h += `<tr class="${l.pos <= 4 ? 'top4' : ''}"><td class="pos">${l.pos}</td><td class="eq">${esc(l.equipe)}</td><td>${l.j}</td>
      <td>${l.diff > 0 ? '+' : ''}${l.diff}</td><td class="pts">${l.pts}</td><td>${forme(l.forme)}</td></tr>`;
  });
  return h + `</tbody></table></div>`;
}

function vueParis(){
  const P = (D.paris || []).slice().reverse();
  const fin = P.filter(p => p.resultat === 'Gagné' || p.resultat === 'Perdu');
  const mise = fin.reduce((s, p) => s + p.mise, 0);
  const ben = P.reduce((s, p) => s + p.benefice, 0);
  const gag = fin.filter(p => p.resultat === 'Gagné').length;
  const enCours = P.filter(p => p.resultat === 'En cours');
  const cls = n => n > 0 ? 'pos-v' : n < 0 ? 'neg-v' : '';
  let h = `<h2>Bilan</h2><div class="kpis">
    <div class="kpi hero"><div class="k">Bénéfice total</div><div class="n ${cls(ben)}">${euros(ben)}</div></div>
    <div class="kpi"><div class="k">ROI</div><div class="n ${cls(ben)}">${mise ? (ben / mise * 100).toFixed(1).replace('.', ',') + ' %' : '–'}</div></div>
    <div class="kpi"><div class="k">Réussite</div><div class="n">${fin.length ? Math.round(gag / fin.length * 100) + ' %' : '–'}</div></div>
    <div class="kpi"><div class="k">Paris terminés</div><div class="n">${fin.length}</div></div>
    <div class="kpi"><div class="k">En cours</div><div class="n">${enCours.length}</div></div>
  </div>`;
  const parType = grouper(fin, p => p.type);
  if(parType.size){
    h += `<h2>Par type de pari</h2><div class="card group">`;
    [...parType.entries()].sort((a, b) => b[1].length - a[1].length).forEach(([t, ps]) => {
      const b = ps.reduce((s, p) => s + p.benefice, 0), g = ps.filter(p => p.resultat === 'Gagné').length;
      h += `<div class="typerow"><span>${esc(t)}</span><span class="s">${g}/${ps.length} gagnés</span><span class="b ${cls(b)}">${euros(b)}</span></div>`;
    });
    h += `</div>`;
  }
  h += `<h2>Historique</h2>`;
  if(!P.length) return h + `<div class="empty">Aucun pari pour l'instant.<br>Appuie sur + pour ajouter ton premier.</div>`;
  P.forEach(p => {
    const t = p.resultat === 'En cours' ? 'cours' : p.resultat;
    h += `<div class="card pari" data-row="${p.row}">
      <span class="m">${esc(p.match)}</span><span class="g ${cls(p.benefice)}">${p.resultat === 'En cours' ? '' : euros(p.benefice)}</span>
      <span class="d">${esc(p.type)} · cote ${fmt(p.cote)} · ${fmt(p.mise)} €${p.date ? ' · ' + new Date(p.date).toLocaleDateString('fr-FR', {day:'numeric', month:'short'}) : ''}</span>
      <span class="tag ${esc(t)}">${esc(p.resultat)}</span></div>`;
  });
  return h;
}

function rendre(){
  if(!D) return;
  $('#maj').textContent = D.maj || '';
  $('#fab').hidden = tab !== 'paris';
  const v = {matchs: vueMatchs, resultats: vueResultats, classements: vueClassements, paris: vueParis}[tab];
  $('#view').innerHTML = v();
}

/* ---------- Config ---------- */
function ecranConfig(erreur){
  $('#fab').hidden = true; $('#maj').textContent = '';
  $('#view').innerHTML = `<div class="config">
    <img src="icon-512.png" alt="">
    <h1>Prono<b>Stats</b></h1>
    <p>Connecte l'appli à ta feuille Google</p>
    <form id="fConfig">
      <label>Adresse de l'application Web (se termine par /exec)</label>
      <input id="cUrl" type="url" required placeholder="https://script.google.com/macros/s/…/exec" value="${esc(store.get('ps_url') || '')}">
      <label>Code d'accès</label>
      <input id="cCode" required placeholder="PS-…" value="${esc(store.get('ps_code') || '')}" autocapitalize="characters">
      <button class="primary" type="submit">Se connecter</button>
      ${erreur ? `<div class="err">${esc(erreur)}</div>` : ''}
    </form></div>`;
  $('#fConfig').onsubmit = e => {
    e.preventDefault();
    store.set('ps_url', $('#cUrl').value.trim());
    store.set('ps_code', $('#cCode').value.trim());
    D = null; store.set('ps_cache', '');
    $('#view').innerHTML = `<div class="empty">Chargement…</div>`;
    charger();
  };
}

/* ---------- Feuilles (formulaires) ---------- */
function ouvrir(html){ $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#veil').classList.remove('hidden'); }
function fermer(){ $('#veil').classList.add('hidden'); }
$('#veil').addEventListener('click', e => { if(e.target.id === 'veil') fermer(); });

function formPari(match){
  const today = new Date(); today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
  const opts = (D && D.prochains || []).map(m => `<option value="${esc(m.dom + ' - ' + m.ext)}">`).join('');
  ouvrir(`<h3>Nouveau pari</h3>
    <form id="fPari">
      <label>Match</label>
      <input id="pMatch" list="lm" required value="${esc(match || '')}" placeholder="Ex : PSG - OM"><datalist id="lm">${opts}</datalist>
      <label>Type de pari</label>
      <select id="pType">${TYPES.map(t => `<option>${t}</option>`).join('')}</select>
      <div class="row2">
        <div><label>Cote</label><input id="pCote" type="number" inputmode="decimal" step="0.01" min="1" required placeholder="1,85"></div>
        <div><label>Mise (€)</label><input id="pMise" type="number" inputmode="decimal" step="0.01" min="0" required placeholder="10"></div>
      </div>
      <label>Date</label>
      <input id="pDate" type="date" value="${today.toISOString().slice(0, 10)}">
      <div class="gain"><span>Gain potentiel</span><b id="pGain">–</b></div>
      <button class="primary" type="submit">Enregistrer le pari</button>
    </form>`);
  const maj = () => { const c = parseFloat($('#pCote').value), m = parseFloat($('#pMise').value);
    $('#pGain').textContent = c && m ? euros(c * m - m) : '–'; };
  $('#pCote').oninput = maj; $('#pMise').oninput = maj;
  $('#fPari').onsubmit = async e => {
    e.preventDefault();
    const b = e.target.querySelector('button[type=submit]'); b.disabled = true; b.textContent = 'Enregistrement…';
    try{
      await envoyer({action:'add', pari:{match:$('#pMatch').value.trim(), type:$('#pType').value,
        cote:$('#pCote').value, mise:$('#pMise').value, date:$('#pDate').value, resultat:'En cours'}});
      fermer(); tab = 'paris'; majTabs(); toast('Pari enregistré'); await charger(true);
    }catch(err){ b.disabled = false; b.textContent = 'Enregistrer le pari'; toast('Erreur : ' + err.message); }
  };
}

function editPari(row){
  const p = (D.paris || []).find(x => x.row === row); if(!p) return;
  ouvrir(`<h3>${esc(p.match)}</h3>
    <div class="d" style="color:var(--muted);margin-top:-8px">${esc(p.type)} · cote ${fmt(p.cote)} · mise ${fmt(p.mise)} €</div>
    <label>Résultat</label>
    <div class="seg">${['En cours', 'Gagné', 'Perdu', 'Remboursé'].map(r =>
      `<button data-r="${r}" class="${r === p.resultat ? 'on' : ''}">${r}</button>`).join('')}</div>
    <button class="danger" id="del">Supprimer ce pari</button>`);
  const act = async (payload, msg) => {
    try{ await envoyer(Object.assign({row:p.row, match:p.match}, payload)); fermer(); toast(msg); await charger(true); }
    catch(err){ toast('Erreur : ' + err.message); }
  };
  $('#sheet').querySelectorAll('.seg button').forEach(b => b.onclick = () => {
    $('#sheet').querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b));
    act({action:'set', resultat:b.dataset.r}, 'Résultat mis à jour');
  });
  $('#del').onclick = () => { if(confirm('Supprimer ce pari ?')) act({action:'delete'}, 'Pari supprimé'); };
}

/* ---------- Événements ---------- */
function majTabs(){ document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab)); rendre(); window.scrollTo(0, 0); }
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if(b && D){ tab = b.dataset.tab; majTabs(); } });
$('#view').addEventListener('click', e => {
  const t = e.target.closest('[data-comp],[data-res],[data-class],[data-bet],[data-row]');
  if(!t) return;
  if(t.dataset.comp) { fComp = t.dataset.comp; rendre(); }
  else if(t.dataset.res) { cRes = t.dataset.res; rendre(); }
  else if(t.dataset.class) { cComp = t.dataset.class; rendre(); }
  else if(t.dataset.bet) formPari(t.dataset.bet);
  else if(t.dataset.row) editPari(Number(t.dataset.row));
});
$('#fab').onclick = () => formPari('');
$('#btnRefresh').onclick = () => { if(!chargement) charger(); };
$('#btnConfig').onclick = () => ecranConfig();
let tt; function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400); }
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && D) charger(true); });

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
charger(true);
</script>
